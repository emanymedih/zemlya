name: Strict pipeline live repeat

on:
  push:
    paths:
      - .github/workflows/pipeline-live-repeat.yml
      - scripts/run_task04.py
      - landradar/pipeline/**
      - landradar/sources/**
      - tests/fixtures/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Ingest publisher-current Geofabrik PBF
        run: sh deploy/geofabrik-worker/run-external-docker.sh "$GITHUB_WORKSPACE/geofabrik-worker-data"
      - name: Prepare writable report directory
        run: |
          mkdir -p geofabrik-worker-data/pipeline/raw/rosstat
          chmod 777 geofabrik-worker-data/pipeline geofabrik-worker-data/pipeline/raw geofabrik-worker-data/pipeline/raw/rosstat
      - name: Strict pipeline and verified catalog export
        run: |
          python scripts/run_task04.py --use-docker-catalog
          cp geofabrik-worker-data/pipeline/current-report.json geofabrik-worker-data/pipeline/first-report.json
      - name: Same-source repeat and verified catalog export
        run: |
          python scripts/run_task04.py --use-docker-catalog
          cp geofabrik-worker-data/pipeline/current-report.json geofabrik-worker-data/pipeline/repeat-report.json
      - name: Verify repeat and restored catalog contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sqlite3

          first = json.loads(Path('geofabrik-worker-data/pipeline/first-report.json').read_text())
          repeat = json.loads(Path('geofabrik-worker-data/pipeline/repeat-report.json').read_text())
          assert first['current_run_id'] != repeat['current_run_id']
          assert first['run']['code_version'] == repeat['run']['code_version']
          for key in ('normalized_records', 'entities', 'relations'):
              assert first['counts'][key] == repeat['counts'][key], key
          for report in (first, repeat):
              assert report['source_summary']['geofabrik_freshness']['status'] == 'current'
              assert report['source_summary']['quality_gate']['status'] == 'PASS'
              assert report['source_summary']['quality_gate']['policy_version'] == 'interim-core-quality/v1'
              assert report['catalog_checks'] == {
                  'integrity_check': 'ok', 'foreign_key_issues': 0, 'schema_version': 2,
              }
              assert report['counts']['relation_record_evidence'] == report['counts']['relations']
          backup = Path('geofabrik-worker-data/pipeline/volume-backup.sqlite')
          with sqlite3.connect(f'{backup.resolve().as_uri()}?mode=ro', uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              assert db.execute('SELECT current_run_id FROM pipeline_state').fetchone()[0] == repeat['current_run_id']
              for key in ('normalized_records', 'entities', 'relations'):
                  assert db.execute(f'SELECT COUNT(*) FROM {key}').fetchone()[0] == repeat['counts'][key]
              assert db.execute('PRAGMA user_version').fetchone()[0] == 2
              assert db.execute('PRAGMA foreign_key_check').fetchone() is None
              assert db.execute('SELECT COUNT(*) FROM run_artifact_observations WHERE run_id=?',
                                (repeat['current_run_id'],)).fetchone()[0] == 5
              assert db.execute('SELECT COUNT(*) FROM run_relation_evidence WHERE run_id=?',
                                (repeat['current_run_id'],)).fetchone()[0] == repeat['counts']['relations']
          print('Strict live repeat and exported catalog verified')
          PY
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-pipeline-reports
          path: |
            geofabrik-worker-data/pipeline/first-report.json
            geofabrik-worker-data/pipeline/repeat-report.json
          if-no-files-found: ignore
