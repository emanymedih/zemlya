name: Core unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Dockerized core regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build runtime image
        run: |
          docker build --build-arg "LANDRADAR_CODE_VERSION=git:${GITHUB_SHA}" \
            -f deploy/geofabrik-worker/Dockerfile -t zemlya-radar:ci .
      - name: Run core tests
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            --entrypoint python zemlya-radar:ci \
            -m unittest discover -s tests -v

  windows-launcher:
    name: Windows CMD entry point
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check launcher without PowerShell scripts
        shell: cmd
        run: scripts\run-task04.cmd --help
      - name: Verify Windows catalog handles and launcher guard
        shell: cmd
        run: python -m unittest discover -s tests -p test_docker_launcher.py -v
