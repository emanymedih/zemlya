services:
  geofabrik-ingest:
    build:
      context: ../..
      dockerfile: deploy/geofabrik-worker/Dockerfile
    environment:
      LANDRADAR_GEOFABRIK_ROOT: /data/geofabrik-pbf
      LANDRADAR_PBF_WORK_DIR: /fast
      TMPDIR: /fast
      CPL_TMPDIR: /fast
    volumes:
      - ../../geofabrik-worker-data:/data
      - landradar-pbf-work:/fast
    restart: "no"

volumes:
  landradar-pbf-work:
    name: landradar-pbf-work
